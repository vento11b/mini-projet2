<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toki — Connexion</title>
    <style>
        /* Centrage vertical/horizontal de la page */
        html, body {
            height: 100%;
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            background: #f3f6fb;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Contrainte du conteneur qui contient logo + carte */
        .center-container {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        /* Espace réservé pour le logo */
        .logo {
            height: 90px;               /* hauteur de l'espace au-dessus */
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            width: 100%;
        }
        .logo img {
            max-height: 80px;
            max-width: 100%;
            object-fit: contain;
        }

        /* Carte du formulaire */
        #form {
            width: 100%;
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(15,23,42,0.08);
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-sizing: border-box;
        }

        #form h1 {
            margin: 0 0 6px 0;
            text-align: center;
            font-size: 1.25rem;
            color: #0f172a;
        }

        /* Champs et bouton */
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #dbe6f5;
            font-size: 1rem;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(90deg,#4f46e5,#7c3aed);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
        }

        /* Responsive */
        @media (max-width: 420px) {
            #form { padding: 18px; }
        }
    </style>
</head>
<body>
    <div class="center-container">
        <div class="logo" aria-hidden="false">
            <!-- Remplacez "logo.png" par le chemin de votre logo ; vous pouvez aussi remplacer ce <img> par du texte ou un SVG -->
            <img src="logo.png" alt="Logo">
            <!-- Si vous voulez juste laisser l'espace vide, laissez l'img tel quel (ou supprimez la balise <img>) -->
        </div>

        <div id="form" role="form" aria-labelledby="titre-connexion">
            <h1 id="titre-connexion">Connexion</h1>
            <input type="text" placeholder="Nom d'utilisateur" aria-label="Nom d'utilisateur">
            <input type="password" placeholder="Mot de passe" aria-label="Mot de passe">
            <button type="button">Se connecter</button>
        </div>
    </div>
</body>
</html>
