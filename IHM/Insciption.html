<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Insciptition</title>

</head>
<body>
    
    <h1>Bienvenue sur la page d'inscription de TOKI </h1>
    <img src="Toki.png" alt="Logo TOKI" width="300" height="200">
    <h2>Inscription</h2>
    <form action="submit_inscription.php" method="post">
        <label for="username">Nom d'utilisateur:</label>
        <input type="text" id="username" name="username" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">Mot de passe*:</label>
        <input type="password" id="password" name="password" required><br><br>

        <label for="confirm_password">Confirmer le mot de passe:</label>
        <input type="password" id="confirm_password" name="confirm_password" required><br>
        <p>*8 caractères minimum, 1 majuscule, 1 chiffre, 1 caractère spécial (!@#$%^&*)</p>
        <br>
        

        <input type="submit" value="S'inscrire">
    </form>
</body>

</html>
