<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="connexion.css">
    <link rel="icon" type="image/png" href="Toki-removebg-preview1.png">
    <title>Toki Inscription</title>

</head>
<body>
    <div class="container">
        <img src="Toki-removebg-preview1.png" alt="Logo TOKI" width="200" height="150">
        <h1>Inscription</h1>
        <form action="submit_inscription.php" method="post">
            <label for="username">Nom d'utilisateur:</label>
            <input type="text" id="username" name="username" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Mot de passe*:</label>
        <input type="password" id="password" name="password" required>
        <p>*8 caractères minimum, 1 majuscule, 1 chiffre, 1 caractère spécial (!@#$%^&*)</p>


        <label for="confirm_password">Confirmer le mot de passe:</label>
        <input type="password" id="confirm_password" name="confirm_password" required>
        
        

        <input type="submit" value="S'inscrire">
    </form>
    </div>
</body>

</html>
