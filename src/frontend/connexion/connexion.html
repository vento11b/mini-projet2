<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/frontend/connexion/style.css">
    <link rel="icon" type="image/png" href="/src/frontend/ressources/Toki-removebg-preview1.png">
    <title>Toki connexion</title>

</head>
<body>
    <div class="container">
        <img src="/src/frontend/ressources/Toki-removebg-preview1.png" alt="Logo TOKI" width="200" height="150">
        <h1>Connexion</h1>
        <form action="/app/connexion" method="post">
            <label for="username">Nom d'utilisateur:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Mot de passe:</label>
            <input type="password" id="password" name="password" required>

            <input type="submit" value="Se connecter">
            <p>Pas inscrit ? <a href="/inscription">S'inscrire</a></p>
        </form>
    </div>
    <script>
        let error = new URLSearchParams(document.location.search).get("error");
        if (error) {
            alert(error);
        }
    </script>
</body>

</html>
