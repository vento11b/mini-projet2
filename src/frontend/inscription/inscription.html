<body>
    <div class="container">
        <img src="/src/frontend/ressources/Toki-removebg-preview1.png" alt="Logo TOKI" width="200" height="150">
        <h1>Inscription</h1>
        <form id="form" action="/app/inscription" method="post">
            <label for="username">Nom d'utilisateur:</label>
            <input type="text" id="username" name="username" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Mot de passe*:</label>
            <input type="password" id="password" name="password" required>
            <p>*8 caractères minimum, 1 majuscule, 1 chiffre, 1 caractère spécial (!@#$%^&*)</p>


            <label for="confirm_password">Confirmer le mot de passe:</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
            

            <!-- lien pour connecter interface inscription et connexion ci-dessous -->
            <input type="submit" value="S'inscrire">
            <p>Déjà inscrit ? <a href="/connexion">Se connecter</a></p>
        </form>
    </div>
