<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/frontend/app/style.css">
    <script defer src="/src/frontend/app/script.js"></script>
    <title>Toki</title>
</head>
<body onload="reloadInfo();"><div id="app">
    <!-- SIDEBAR -->
    <div id="chatlist">
        <div id="chatlist-top">
            <div id="add_contact">
                <div class="input-group">
                    <input type="text" id="addfriend" placeholder="Ajouter ami">
                    <button onclick="add_friend(document.getElementById('addfriend').value)">+</button>
                </div>
                <div class="input-group">
                    <input type="text" placeholder="Ajouter groupe">
                    <button>+</button>
                </div>
            </div>
        </div>

        <div id="chatlist-body">
            <div id="contact_list"></div>
        </div>

        <div id="chatlist-bottom">
            <div id="compte">
                <div class="user-info">
                    <span id="username"></span>
                </div>
                <button class="logout" onclick="deconnexion()">Déconnexion</button>
            </div>
        </div>
    </div>

    <!-- CHAT -->
    <div id="chat">
        <div id="chat-top">
            <div id="chat-info">Sélectionne un chat</div>
        </div>

        <div id="chat-body">
            <div id="message_list"></div>
        </div>

        <div id="chat-bottom">
            <div id="input">
                <input type="text" id="message_input" placeholder="Envoyer message...">
                <button onclick="sendMessage()">Envoyer</button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
