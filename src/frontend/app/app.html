<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/frontend/app/style.css">
    <script defer src="/src/frontend/app/script.js"></script>
    <title>Toki</title>
</head>
<body>
    <div id="app">
        <div id="chatlist">
            <div id="chatlist-top">
                <div id="add_contact">
                    <input type="text" class="newcontact" placeholder="Ajouter contact">
                    <button>+</button>
                    <br>
                    <input type="text" class="newgroup" placeholder="Ajouter groupe">
                    <button>+</button>
                </div>
            </div>
            <div id="chatlist-body">
                <div id="contact_list"></div>
            </div>
            <div id="chatlist-bottom">
                <div id="compte">
                    <span id="username" data-username="MonNom"></span>
                    <button onclick="deconnexion()">Déconnexion</button>
                </div>
            </div>
        </div>

        <div id="chat">
            <div id="chat-top">
                <div id="chat-info">

                </div>
                <div id="chat-logo">
                    <img src="/src/frontend/ressources/Toki-removebg-preview1.png" alt="Logo">
                </div>
            </div>
            <div id="chat-body">
                <div id="message_list"></div>
            </div>
            <div id="chat-bottom">
                <div id="input">
    <input type="text" id="message_input" placeholder="Envoyer message">
    <button id="send_button">Envoyer</button>
</div>
                </div>
            </div>
        </div>
    </div>
    <script defer src="/src/frontend/app/loadDOM.js"></script>

</body>
</html>
